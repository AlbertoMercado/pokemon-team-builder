site_name: Pokémon Team Builder
site_description: Documentación del generador de equipos Pokémon
repo_url: https://github.com/AlbertoMercado/pokemon-team-builder
repo_name: AlbertoMercado/pokemon-team-builder
edit_uri: edit/main/docs/

theme:
  name: material
  language: es
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: amber
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Inicio: index.md
  - Diseño funcional (DDF):
      - 01-ddf/index.md
      - Requisitos funcionales: 01-ddf/requisitos-funcionales.md
      - Reglas de negocio: 01-ddf/reglas-negocio.md
      - Cuestiones funcionales: 01-ddf/cuestiones-abiertas.md
  - Diseño técnico (DDT):
      - 02-ddt/index.md
      - Arquitectura: 02-ddt/arquitectura.md
      - Estructura del código: 02-ddt/estructura-codigo.md
      - Modelo de datos: 02-ddt/modelo-datos.md
      - API: 02-ddt/api.md
      - Algoritmo de generación: 02-ddt/algoritmo-generacion.md
      - Datos requeridos: 02-ddt/datos-requeridos.md
      - Datos curados: 02-ddt/datos-curados.md
      - Plan de la primera carga: 02-ddt/plan-carga-datos.md
  - Decisiones (ADR):
      - 03-adr/index.md
      - Plantilla: 03-adr/0000-plantilla.md
      - "0001 · Stack tecnológico": 03-adr/0001-stack-tecnologico.md
      - "0002 · Monolito modular con núcleo puro": 03-adr/0002-monolito-modular-nucleo-puro.md
      - "0003 · Dos bases de datos SQLite": 03-adr/0003-dos-bases-de-datos-sqlite.md
      - "0004 · PokeAPI mediante su volcado CSV": 03-adr/0004-pokeapi-volcado-csv.md
      - "0005 · Datos curados en YAML": 03-adr/0005-datos-curados-yaml.md
      - "0006 · Búsqueda exacta": 03-adr/0006-algoritmo-busqueda-exacta.md
      - "0007 · Cliente generado desde OpenAPI": 03-adr/0007-cliente-generado-openapi.md
  - Manual de usuario: 04-manual-usuario/index.md
  - Operación:
      - 05-operacion/index.md
      - Entorno de desarrollo en macOS: 05-operacion/entorno-desarrollo-macos.md
      - Ingesta de datos: 05-operacion/ingesta.md
