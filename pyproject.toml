[project]
name = "pokemon-team-builder"
version = "1.1.1"
description = "Generador de equipos Pokémon a partir de favoritos y reglas configurables"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "mwparserfromhell>=0.7.2",
    "pillow>=12",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "sqlmodel>=0.0.47",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "hypothesis>=6.100",
    "import-linter>=2.1",
    "mkdocs-material>=9.5",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["web"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "N",   # pep8-naming
    "RUF", # ruff-specific
    "PL",  # pylint
    "PT",  # flake8-pytest-style
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"] # magic values are fine in assertions
# Test data builders take many optional keyword arguments so each test states only what it needs.
"tests/core/builders.py" = ["PLR2004", "PLR0913", "PLR0917"]
"tests/api/factories.py" = ["PLR2004", "PLR0913", "PLR0917"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["core", "db", "ingest", "api", "tests"]
# Module names come from the repository root (tests/core/builders.py is tests.core.builders),
# because tests/ is not a package: the project is not installed (tool.uv.package = false).
mypy_path = "."
explicit_package_bases = true
warn_unreachable = true
pretty = true

# Dependency contracts between project packages (ADR-0002).
# Allowed: api -> core, db; ingest -> db. Documented in docs/02-ddt/estructura-codigo.md.
# That core/ uses only the standard library is checked by tests/test_architecture.py.
[tool.importlinter]
root_packages = ["core", "db", "ingest", "api"]

[[tool.importlinter.contracts]]
id = "core-pure"
name = "core no depende de ningún otro paquete del proyecto"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["db", "ingest", "api"]

[[tool.importlinter.contracts]]
id = "db-base"
name = "db no depende de ningún otro paquete del proyecto"
type = "forbidden"
source_modules = ["db"]
forbidden_modules = ["core", "ingest", "api"]

[[tool.importlinter.contracts]]
id = "ingest-only-db"
name = "ingest solo depende de db"
type = "forbidden"
source_modules = ["ingest"]
forbidden_modules = ["core", "api"]

[[tool.importlinter.contracts]]
id = "api-not-ingest"
name = "api no depende de ingest"
type = "forbidden"
source_modules = ["api"]
forbidden_modules = ["ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The project is not installed as a package (tool.uv.package = false): tests import core, db,
# ingest and api from the repository root.
pythonpath = ["."]
addopts = ["--strict-markers", "-ra"]
markers = [
    "rn(id): verifica una regla de negocio del DDF, p. ej. rn(\"RN-01\")",
]
