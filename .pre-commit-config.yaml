repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe] # mkdocs.yml usa etiquetas !!python/name
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # mypy y import-linter usan el entorno del proyecto (uv) para ver todas sus dependencias
  # (SQLModel, pydantic…) sin duplicarlas aquí. La configuración está en pyproject.toml.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]

      # Contratos de dependencia entre paquetes (ADR-0002).
      - id: lint-imports
        name: import-linter (contratos de dependencia)
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        types: [python]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
