# Catálogo de juegos (RF-25, CA-90): los juegos de la saga principal y los Leyendas que pueden
# recibir un Pokémon criado, en orden de lanzamiento. En él, el usuario elige sus juegos
# objetivo. Esquema y significado: docs/02-ddt/datos-curados.md.
#
# game es el identificador de PokeAPI; el nombre y la generación salen de PokeAPI.
# receives_bred: si puede recibir un Pokémon criado, en el propio juego o por transferencia
# (CA-29, CA-91). playable_now: "yes" (entre comillas, porque yes sin ellas es un booleano) si
# se sabe que es jugable en un sistema actual de Nintendo (la Switch 2 ejecuta los juegos de
# Switch); unknown (por defecto), si no, y se pregunta al usuario (CA-92).
# Let's Go Pikachu y Let's Go Eevee no están: no se les puede llevar un Pokémon criado (CA-90).
games:
  - game: red
    platform: game_boy
    receives_bred: false
    note: Sin crianza, y no recibe un Pokémon recién nacido de otro juego (CA-29).
  - game: blue
    platform: game_boy
    receives_bred: false
    note: Sin crianza, y no recibe un Pokémon recién nacido de otro juego (CA-29).
