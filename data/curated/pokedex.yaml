# Si el juego tiene Pokédex Nacional, la Nacional; si no, la regional. Los nombres son los
# identificadores de PokeAPI.
games:
  red: [kanto]
  blue: [kanto]
  yellow: [kanto]
  gold: [original-johto]
  silver: [original-johto]
  crystal: [original-johto]
  ruby: [national]
  sapphire: [national]
  emerald: [national]
  firered: [national]
  leafgreen: [national]
