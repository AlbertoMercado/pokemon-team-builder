# Combates clave de HeartGold y SoulSilver (RN-17), en su orden habitual.
# Esquema y significado: docs/02-ddt/datos-curados.md.
#
# Los equipos se leen de la sección wikidex_section de la página de WikiDex de cada
# entrenador; algunas páginas la titulan de otra forma, o ponen cada combate en una subsección,
# y el combate da la suya. En los gimnasios, el combate por la medalla, y en el Alto Mando, el
# primero: las revanchas son tras la Liga. Del Team Rocket cuenta Atlas, en la Torre Radio
# (CA-95), y del rival, su último combate obligatorio, sin su inicial y solo los Pokémon comunes
# a sus tres variantes (CA-26, CA-38, CA-89). Lo de Kanto, posterior a la Liga, no cuenta
# (CA-96).
