# entrenador; algunas páginas la titulan de otra forma y el combate da la suya. En los
# gimnasios, el combate por la medalla: las revanchas son tras la Liga. Hay que combatir a los
# dos jefes malvados: cuenta el último combate obligatorio de cada uno (CA-88). De los rivales
# solo cuenta Blasco: el último combate obligatorio de Bruno o Aura, en la Ruta 119, no tiene
# ningún Pokémon común a sus tres variantes, que dependen del inicial (CA-38, CA-89).
