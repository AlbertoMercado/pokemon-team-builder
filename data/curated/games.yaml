    day_night_cycle:
      value: true
      origin: inferred
      note: >-
        Tiene reloj interno: Eevee evoluciona a Espeon de día (de 12:00 a 23:59) y a Umbreon
        de noche (de 0:00 a 11:59), con mucha amistad.
    contests:
      value: true
      origin: inferred
      note: >-
        Tiene concursos y Pokécubos: se puede subir la belleza que necesita Feebas para
        evolucionar a Milotic.
